spring:
  application:
    name: finance-api
  config:
    import: optional:file:.env[.properties]
  jackson:
    mapper:
      allow-coercion-of-scalars: false
  web:
    resources:
      add-mappings: false
  devtools:
    livereload:
      enabled: false

server:
  port: ${PORT:3333}
  error:
    whitelabel:
      enabled: false

finance:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  data-dir: ${DATA_DIR:}
